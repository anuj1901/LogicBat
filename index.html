<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogicBat — Master Your Logic Building</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="homeBtn" class="brand" type="button" aria-label="Go to LogicBat Home">
        <span class="brand-logo">&lt;/&gt;</span>
        <span>
          <span class="brand-title">LogicBat</span>
          <span class="brand-sub">280 Logic Building Challenges</span>
        </span>
      </button>

      <div class="topbar-actions">
        <span id="globalProgressPill" class="pill">0 / 280 Solved</span>
        <div class="lang-switch" role="group" aria-label="Programming Language">
          <button id="langJavaBtn" class="lang-btn active" type="button">Java</button>
          <button id="langPyBtn" class="lang-btn" type="button">Python</button>
        </div>
        <button id="themeToggleBtn" class="btn btn-sm" type="button" aria-label="Toggle Dark Mode">Theme</button>
      </div>
    </div>
  </header>

  <main id="appRoot" class="container"></main>

  <div id="confirmModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3 id="modalTitle" style="margin-top:0">Confirm Action</h3>
      <p id="modalMessage" style="color:var(--text-muted); font-size:0.9rem"></p>
      <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1rem">
        <button id="modalCancelBtn" class="btn" type="button">Cancel</button>
        <button id="modalConfirmBtn" class="btn btn-danger-outline" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/problems.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
